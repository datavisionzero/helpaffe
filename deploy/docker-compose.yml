name: helpaffe

services:
  helpaffe:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: Host=db;Port=5432;Database=helpaffe;Username=helpaffe;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      Bootstrap__Name: ${HELPAFFE_BOOTSTRAP_NAME:-Administrator}
      Bootstrap__Email: ${HELPAFFE_BOOTSTRAP_EMAIL:?set HELPAFFE_BOOTSTRAP_EMAIL in deploy/.env}
      Bootstrap__Password: ${HELPAFFE_BOOTSTRAP_PASSWORD:?set HELPAFFE_BOOTSTRAP_PASSWORD in deploy/.env}
      Secrets__EncryptionKey: ${HELPAFFE_SECRETS_ENCRYPTION_KEY:?set HELPAFFE_SECRETS_ENCRYPTION_KEY in deploy/.env}
      Attachments__RootPath: /var/lib/helpaffe/attachments
      Observability__Logaffe__Url: ${HELPAFFE_LOGAFFE_URL:-}
      Observability__Logaffe__IngestToken: ${HELPAFFE_LOGAFFE_TOKEN:-}
    ports:
      - "${HELPAFFE_BIND_ADDRESS:-127.0.0.1}:${HELPAFFE_HTTP_PORT:-5066}:8080"
    volumes:
      - helpaffe-attachments:/var/lib/helpaffe/attachments
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/live >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: helpaffe
      POSTGRES_USER: helpaffe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - helpaffe-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpaffe -d helpaffe"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  helpaffe-db:
  helpaffe-attachments:
