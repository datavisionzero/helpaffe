name: helpaffe-dev

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: helpaffe
      POSTGRES_USER: helpaffe
      POSTGRES_PASSWORD: helpaffe
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "56632:5432"
    volumes:
      - helpaffe-dev-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpaffe -d helpaffe"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  helpaffe-dev-db:
