name: Release

# One tag names the server image, CLI binaries, and GitHub release. Re-running
# with an existing tag is supported without moving or recreating that tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/datavisionzero/helpaffe

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.read.outputs.tag }}
      version: ${{ steps.read.outputs.version }}
      stable: ${{ steps.read.outputs.stable }}
      sha: ${{ steps.read.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
      - id: read
        name: Check the tag and trunk
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Expected a tag like v0.1.0 or v0.1.0-rc.1"
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::Release tags must name a commit on main"
            exit 1
          }
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "sha=$(git rev-parse HEAD)"
            if [[ "$TAG" == *-* ]]; then
              echo "stable=false"
            else
              echo "stable=true"
            fi
          } >> "$GITHUB_OUTPUT"

  verify-dotnet:
    name: Verify .NET
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet test Helpaffe.slnx -c Release

  verify-web:
    name: Verify web
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  verify-cli:
    name: Verify CLI
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/cli
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/cli/go.mod
          cache-dependency-path: src/cli/go.sum
      - run: go vet ./...
      - run: go test ./...

  image:
    name: Image (${{ matrix.arch }})
    needs: [version, verify-dotnet, verify-web, verify-cli]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        name: Build and push the architecture digest
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            REVISION=${{ needs.version.outputs.sha }}
          provenance: true
          sbom: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
      - name: Hand the digest to the index job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  image-index:
    name: Multi-architecture image
    needs: [version, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and verify the image index
        working-directory: /tmp/digests
        env:
          VERSION: ${{ needs.version.outputs.version }}
          STABLE: ${{ needs.version.outputs.stable }}
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 2
          tags=(--tag "$IMAGE:$VERSION")
          if [[ "$STABLE" == true ]]; then tags+=(--tag "$IMAGE:latest"); fi
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION" \
            --format '{{json .Manifest}}' > /tmp/helpaffe-index.json
          python3 - <<'PY'
          import json

          with open("/tmp/helpaffe-index.json", encoding="utf-8") as source:
              index = json.load(source)
          platforms = {
              f"{platform['os']}/{platform['architecture']}"
              for manifest in index.get("manifests", [])
              if (platform := manifest.get("platform"))
          }
          required = {"linux/amd64", "linux/arm64"}
          if not required.issubset(platforms):
              raise SystemExit(f"missing architectures: {required - platforms}")
          print("published", ", ".join(sorted(required)))
          PY

  cli:
    name: CLI binaries
    needs: [version, verify-cli]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/cli
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/cli/go.mod
          cache-dependency-path: src/cli/go.sum
      - name: Build and checksum
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${platform%/*}"
            arch="${platform#*/}"
            directory="dist/$os-$arch"
            mkdir -p "$directory"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath -ldflags="-s -w -X main.version=$VERSION" \
              -o "$directory/helpaffe" ./cmd/helpaffe
            cp ../../LICENSE "$directory/LICENSE"
            if [[ "$platform" == linux/amd64 ]]; then
              test "$("$directory/helpaffe" version)" = "helpaffe $VERSION"
            fi
            tar -czf "dist/helpaffe_${VERSION}_${os}_${arch}.tar.gz" \
              -C "$directory" helpaffe LICENSE
          done
          cd dist
          sha256sum helpaffe_*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: cli-release
          path: |
            src/cli/dist/*.tar.gz
            src/cli/dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [version, image-index, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          name: cli-release
          path: dist
      - name: Publish the entry and CLI assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          STABLE: ${{ needs.version.outputs.stable }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi
          options=(--verify-tag --title "helpaffe $VERSION")
          if [[ "$STABLE" != true ]]; then options+=(--prerelease); fi
          if [[ -f "docs/releases/$TAG.md" ]]; then
            options+=(--notes-file "docs/releases/$TAG.md")
          else
            options+=(--generate-notes)
          fi
          gh release create "$TAG" dist/* "${options[@]}"
